name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies (runtime + dev)
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy . || true

      - name: Run tests
        run: uv run pytest -q

      - name: Build package (sdist/wheel)
        run: uv build

  quotex-extra:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync with quotex extra
        run: uv sync --group dev --group quotex
      - name: Import smoke (quotex adapter)
        run: |
          python - <<'PY'
          from nexus.adapters.quotex import QuotexAdapter
          print('QuotexAdapter import OK (pyquotex optional).')
          PY

