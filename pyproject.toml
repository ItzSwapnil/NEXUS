[project]
name = "nexus"
version = "2.0.0"
description = "NEXUS: Fully Dynamic, Self-Evolving AI Trader for Quotex"
requires-python = ">=3.13.6"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "omegaconf",
    "pandas",
    "duckdb",
    "PySide6",
    "pyyaml",
    "rich",
    "loguru",
    "pyqtgraph",
    "pandas-stubs==2.3.0.250703",
    "pyquotex",
]

[project.scripts]
nexus = "nexus.main:main"
nexus-cli = "nexus.cli:run"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "mypy", "Sphinx", "mkdocs", "mkdocstrings", "ruff", "black", "flake8", "playwright"]
quotex = ["pyquotex @ git+https://github.com/cleitonleonel/pyquotex.git@master"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.uv.sources]
pyquotex = { git = "https://github.com/cleitonleonel/pyquotex.git" }

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "mypy", "Sphinx", "mkdocs", "mkdocstrings", "ruff", "black", "flake8", "playwright"]
quotex = ["pyquotex @ git+https://github.com/cleitonleonel/pyquotex.git@master"]
