
[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "3.0.0"
description = "NEXUS - Autonomous AI Trading System with Deep Learning and Reinforcement Learning"
authors = [{ name = "Swapnil De Sarkar" }]
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
keywords = [
    "trading",
    "ai",
    "machine-learning",
    "deep-learning",
    "reinforcement-learning",
    "algorithmic-trading",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyquotex @ git+https://github.com/cleitonleonel/pyquotex.git",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "orjson>=3.10.0",
    "ta-lib>=0.6.0",
    "pandas-ta-classic>=0.6.0",
    "stock-indicators>=1.3.0",
    "granian>=1.0",
    "litestar>=2.24",
    "transformers>=5.17.0",
    "huggingface-hub>=1.31.0",
    "accelerate>=1.15.0",
    "chronos-forecasting>=2.3.2",
]

[project.optional-dependencies]

# GUI dependencies
gui = [
    "PySide6>=6.5.0",
    "matplotlib>=3.7.0",
]

# Technical analysis dependencies
ta = [
    "scipy>=1.10.0",
]

# AI/ML dependencies
ai = [
    "torch>=2.15.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

# Broker integration
quotex = []

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

# Testing extras
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "playwright>=1.40.0",
]

# Full installation
full = [
    "nexus[gui,ta,ai,quotex,dev,test]",
]

[project.urls]
Homepage = "https://github.com/ItzSwapnil/NEXUS"
Documentation = "https://github.com/ItzSwapnil/NEXUS/blob/main/README.md"
Repository = "https://github.com/ItzSwapnil/NEXUS"
Issues = "https://github.com/ItzSwapnil/NEXUS/issues"

[project.scripts]
nexus = "nexus.main:main"
nexus-cli = "nexus.cli:main"
nexus-train = "nexus.ai.train_models:main"

# PyTorch CUDA 13.4 package source
[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu134" }

[tool.setuptools]
packages = { find = { include = ["nexus*"] } }

[tool.setuptools.package-data]
nexus = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.black]
line-length = 100
target-version = ["py315"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.15"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
