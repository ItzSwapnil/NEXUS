[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "3.0.0"
description = "NEXUS - Autonomous AI Trading System with Deep Learning and Reinforcement Learning"
authors = [{name = "Swapnil De Sarkar"}]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["trading", "ai", "machine-learning", "deep-learning", "reinforcement-learning", "algorithmic-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies - minimal set required for basic functionality
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyquotex",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "orjson>=3.10.0",
    "ta-lib>=0.6.0",
    "pandas-ta-classic>=0.6.0",
    "stock-indicators>=1.3.0",
]

[project.optional-dependencies]
# GUI dependencies
gui = [
    "PySide6>=6.5.0",
    "matplotlib>=3.7.0",
]

# Technical analysis dependencies
ta = [
    "scipy>=1.10.0",
]

# Broad indicator providers are enabled in the runtime. Stock Indicators also
# requires a system .NET runtime; NEXUS reports it as unavailable when .NET
# is absent instead of breaking live analysis.

# AI/ML dependencies. Install the `ai` extra for model inference/training.
ai = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

# Broker integration (optional - install manually if needed)
quotex = [
    # "pyquotex>=1.0.0",  # Install manually: pip install pyquotex or from source
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

# Testing extras
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "playwright>=1.40.0",
]

# Full installation (all features)
full = [
    "nexus[gui,ta,ai,quotex,dev,test]",
]

[project.urls]
Homepage = "https://github.com/yourusername/nexus"
Documentation = "https://github.com/yourusername/nexus/blob/main/README.md"
Repository = "https://github.com/yourusername/nexus"
Issues = "https://github.com/yourusername/nexus/issues"

[project.scripts]
nexus = "nexus.main:main"
nexus-cli = "nexus.cli:main"
nexus-train = "nexus.ai.train_models:main"

[tool.setuptools]
# Include all nested runtime packages in wheels/sdists. Listing only the
# top-level package silently drops adapters, strategies, tests' dependencies,
# and other submodules from installed distributions.
packages = {find = {include = ["nexus*"]}}

[tool.setuptools.package-data]
nexus = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.black]
line-length = 100
target-version = ['py312', 'py313', 'py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long
    "B008",  # function calls in default args
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]


[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.uv.sources]
pyquotex = { git = "https://github.com/cleitonleonel/pyquotex.git" }
